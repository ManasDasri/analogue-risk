name: CI

on:
  push:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Build Rust core
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install maturin numpy pandas scipy matplotlib tabulate pytest
          maturin develop --release
      - name: Clippy
        run: cargo clippy --release -- -D clippy::correctness
      - name: Tests
        run: |
          . .venv/bin/activate
          pytest -q tests
