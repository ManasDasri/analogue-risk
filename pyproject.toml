[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "analogue-risk"
version = "2.0.0"
description = "Regime-conditioned analogue forecasting with self-exciting tail-risk gating"
requires-python = ">=3.12"
dependencies = ["numpy>=2.0", "pandas>=2.2", "scipy>=1.13", "matplotlib>=3.9"]

[tool.maturin]
module-name = "analogue_risk._core"
python-source = "python"
features = ["pyo3/extension-module"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E731", "E741", "E501"]  # E501: long string literals; code width is enforced by ruff format

[tool.ruff.lint.per-file-ignores]
# these set sys.path / the matplotlib backend before importing, by design
"tests/*" = ["E402"]
"results/dev/*" = ["E402"]
"paper/make_tables.py" = ["E402"]
"python/analogue_risk/figures.py" = ["E402"]
