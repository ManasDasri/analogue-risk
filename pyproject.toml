[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "analogue-risk"
version = "2.0.0"
description = "Fast, leakage-safe regime-conditioned analogue forecasting of financial risk"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Manas Ganesh Dasari" }, { name = "Vishal KVS" }, { name = "K. N. Meera" }]
requires-python = ">=3.12"
dependencies = ["numpy>=2.0", "pandas>=2.2", "scipy>=1.13", "matplotlib>=3.9", "scikit-learn>=1.4", "tabulate>=0.9"]
keywords = ["forecasting", "nearest neighbours", "analogues", "volatility", "value-at-risk", "hawkes"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: Implementation :: CPython",
    "Intended Audience :: Science/Research",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Mathematics",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/ManasDasri/analogue-risk"
Repository = "https://github.com/ManasDasri/analogue-risk"
Issues = "https://github.com/ManasDasri/analogue-risk/issues"

[tool.maturin]
module-name = "analogue_risk._core"
python-source = "python"
features = ["pyo3/extension-module"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E731", "E741", "E501"]  # E501: long string literals; code width is enforced by ruff format

[tool.ruff.lint.per-file-ignores]
# these set sys.path / the matplotlib backend before importing, by design
"tests/*" = ["E402"]
"results/dev/*" = ["E402"]
"paper/make_tables.py" = ["E402"]
"python/analogue_risk/figures.py" = ["E402"]
